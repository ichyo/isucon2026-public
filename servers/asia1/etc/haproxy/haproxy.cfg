# HAProxy on asia1 (docs/design.md §13.1): the router sends every region-asia request to asia1:80; HAProxy
# balances them over the asia1 app (127.0.0.1:8080, ISUREAL_LISTEN in app.env) and the asia2 app
# (192.168.4.10:80). Pure pass-through: no header is added or changed (X-Client-IP, X-Country-Code,
# Authorization untouched), no body limit here (the app answers 413 itself), no logging.
#
# Weights: edit below + scripts/deploy_etc.sh asia1 (reload), or at runtime (lost on reload):
#   echo "set weight be_app/asia2 30" | sudo socat stdio /run/haproxy/admin.sock
#   echo "disable server be_app/asia2" | sudo socat stdio /run/haproxy/admin.sock   # all traffic to asia1
#   echo "show servers state be_app"   | sudo socat stdio /run/haproxy/admin.sock
global
    nbthread 2
    maxconn 60000
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    # upload gate: small fixed buffers in the upload direction (router→haproxy, haproxy→app) so an upload the app
    # does not read yet stops being sent instead of filling autotuned (up to 30 MB) buffers
    tune.rcvbuf.client 65536
    tune.sndbuf.server 65536
    user haproxy
    group haproxy

defaults
    mode http
    maxconn 60000
    option http-keep-alive
    option splice-auto
    http-reuse aggressive
    timeout connect 3s
    # inactivity timeouts; generous so slow uploads through the router (tens of seconds) are never cut, and
    # idle keep-alive connections from the router are never closed by us (the router may reuse one at the same
    # moment ⇒ EOF on a non-idempotent POST)
    timeout client 30m
    timeout server 300s
    timeout http-request 30s
    timeout http-keep-alive 30m
    timeout queue 10s
    # SSE streams idle up to 60 s before the app closes them; tunnels (if any) may live long
    timeout tunnel 1h
    timeout client-fin 5s
    timeout server-fin 5s
    option redispatch 1
    retries 2
    # only retry when the request never reached a server (safe for POST)
    retry-on conn-failure

frontend fe_http
    bind :80
    # image GETs are bandwidth-heavy and CPU-light: serve them from asia1's own app (no second hop through asia1's NIC)
    acl is_img path_beg /api/images/
    use_backend be_local if is_img
    default_backend be_app

backend be_local
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host localhost hdr X-Isureal-Health 1
    http-check expect status 200
    default-server check inter 500 fastinter 250 downinter 500 rise 2 fall 2
    server asia1 127.0.0.1:8080
    server asia2 192.168.4.10:80 backup

backend be_app
    balance leastconn
    option httpchk
    # the app answers 200 to this only while it may serve reads (in sync with the leader), else 503
    http-check send meth GET uri / ver HTTP/1.1 hdr Host localhost hdr X-Isureal-Health 1
    http-check expect status 200
    default-server check inter 500 fastinter 250 downinter 500 rise 2 fall 2
    server asia1 127.0.0.1:8080 weight 40
    server asia2 192.168.4.10:80 weight 60
